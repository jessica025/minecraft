<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的世界</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay">
  <h1>我的世界</h1>
  <div class="tagline">探索 · 建造 · 生存</div>
  <button id="startBtn">开始游戏</button>
  <div id="controls">
    WASD 移动 &nbsp;·&nbsp; 空格 跳跃 &nbsp;·&nbsp; Shift 下蹲<br>
    鼠标左键 挖掘方块 &nbsp;·&nbsp; 鼠标右键 放置方块<br>
    滚轮 / 数字键 切换方块 &nbsp;·&nbsp; F 飞行模式 &nbsp;·&nbsp; ESC 暂停
  </div>
</div>

<div id="hud">
  <svg id="crosshair" viewBox="0 0 22 22">
    <line x1="11" y1="2" x2="11" y2="20" stroke="black" stroke-width="2.5" opacity="0.6"/>
    <line x1="2" y1="11" x2="20" y2="11" stroke="black" stroke-width="2.5" opacity="0.6"/>
    <line x1="11" y1="2" x2="11" y2="20" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="2" y1="11" x2="20" y2="11" stroke="white" stroke-width="1.5" opacity="0.9"/>
  </svg>
  <div id="hotbar"></div>
  <div id="selected-name"></div>
  <div id="debug"></div>
  <div id="break-bar"><div id="break-fill"></div></div>
  <div id="pause-screen">
    <h2>游戏已暂停</h2>
    <p>点击画面继续</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/noise.js"></script>
<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
